name: publish_release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANONRODE_KEYSTORE_BASE64: ${{ secrets.ANONRODE_KEYSTORE_BASE64 }}
      ANONRODE_KEYSTORE_PATH: ${{ runner.temp }}/anonrode.keystore.p12
      ANONRODE_KEY_ALIAS: ${{ secrets.ANONRODE_KEY_ALIAS }}
      ANONRODE_STORE_PASSWORD: ${{ secrets.ANONRODE_STORE_PASSWORD }}
      ANONRODE_KEY_PASSWORD: ${{ secrets.ANONRODE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Decode signing keystore
        run: |
          if [ -n "$ANONRODE_KEYSTORE_BASE64" ]; then
            echo "$ANONRODE_KEYSTORE_BASE64" | base64 -d > "$ANONRODE_KEYSTORE_PATH"
            echo "Keystore decoded for shared signing."
          else
            echo "No keystore secret — falling back to transient debug signing."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs (stable shared signing key)
        run: ./gradlew assembleReleaseWithDebugSigning assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} apks/ \;
          cd apks
          for f in *.apk; do mv "$f" "anonrode-player-${{ github.ref_name }}-$f"; done

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: apks/*.apk
