name: ui_render

# Renders the real player chrome into PNGs (Robolectric + Roborazzi) and
# uploads them as artifacts for side-by-side design diffing against
# scratch/proposed_black_glass_player.html. Dispatch-only on purpose: the
# full build/test pipeline stays the phase gate; this is the on-demand
# screenshot farm, never a per-push cost.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Render player-screen states
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-screens-${{ github.sha }}
          path: |
            **/src/test/snapshots/*.png
          if-no-files-found: ignore

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-test-results-${{ github.sha }}
          path: |
            **/build/test-results/testDebugUnitTest/**
            **/build/reports/tests/**
