name: android_build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANONRODE_KEYSTORE_BASE64: ${{ secrets.ANONRODE_KEYSTORE_BASE64 }}
      ANONRODE_KEY_ALIAS: ${{ secrets.ANONRODE_KEY_ALIAS }}
      ANONRODE_STORE_PASSWORD: ${{ secrets.ANONRODE_STORE_PASSWORD }}
      ANONRODE_KEY_PASSWORD: ${{ secrets.ANONRODE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Decode signing keystore
        run: |
          if [ -n "$ANONRODE_KEYSTORE_BASE64" ]; then
            echo "$ANONRODE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/anonrode.keystore.p12"
            echo "ANONRODE_KEYSTORE_PATH=$RUNNER_TEMP/anonrode.keystore.p12" >> "$GITHUB_ENV"
            echo "Keystore decoded for shared signing."
          else
            echo "No keystore secret - falling back to transient debug signing."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/**/*.apk
