name: android_build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANONRODE_KEYSTORE_BASE64: ${{ secrets.ANONRODE_KEYSTORE_BASE64 }}
      ANONRODE_KEY_ALIAS: ${{ secrets.ANONRODE_KEY_ALIAS }}
      ANONRODE_STORE_PASSWORD: ${{ secrets.ANONRODE_STORE_PASSWORD }}
      ANONRODE_KEY_PASSWORD: ${{ secrets.ANONRODE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Decode signing keystore
        run: |
          if [ -n "$ANONRODE_KEYSTORE_BASE64" ]; then
            echo "$ANONRODE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/anonrode.keystore.p12"
            echo "ANONRODE_KEYSTORE_PATH=$RUNNER_TEMP/anonrode.keystore.p12" >> "$GITHUB_ENV"
            echo "Keystore decoded for shared signing."
          else
            echo "No keystore secret - falling back to transient debug signing."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # v0.8.7: the unit tests were never wired into CI — they existed in
      # core/media/src/test but no workflow ever invoked them, so a regression
      # in the sync engine could only be found on a phone. This gate runs
      # before the APK build so a broken engine fails fast and loud, and the
      # JUnit XML is uploaded even on failure so the report is readable from
      # the Actions run without re-running anything locally.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/build/test-results/testDebugUnitTest/**
            **/build/reports/tests/testDebugUnitTest/**

      - name: Build debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/**/*.apk
