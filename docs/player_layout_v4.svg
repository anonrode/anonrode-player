<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600">
  <rect x="20" y="20" width="680" height="1560" rx="40" ry="40" fill="#0F1115" stroke="#2A2D33" stroke-width="2"/>
  <rect x="20" y="20" width="680" height="48" fill="#000000" opacity="0.4"/>

  <rect x="40" y="68" width="640" height="120" fill="#000000" opacity="0.0"/>

  <g id="top-bar" font-family="sans-serif">
    <rect x="40" y="68" width="640" height="120" fill="url(#topScrim)"/>
    <defs>
      <linearGradient id="topScrim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g transform="translate(56, 100)">
      <path d="M 0 16 L 20 36 L 0 56" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="108" y="124" font-size="18" fill="#FFFFFF" font-weight="500">Episode Title &#8212; S01E03</text>
    <text x="108" y="148" font-size="13" fill="#A0A4AB" font-weight="400">Series Name</text>
    <g transform="translate(632, 100)">
      <rect x="0" y="0" width="44" height="44" rx="22" fill="#2A2D33" opacity="0.6"/>
      <text x="22" y="30" font-size="20" fill="#FFFFFF" text-anchor="middle">&#8943;</text>
    </g>
  </g>

  <g id="video">
    <rect x="40" y="200" width="640" height="900" fill="#000000"/>
    <text x="360" y="650" font-family="sans-serif" font-size="32" fill="#5A5E66" text-anchor="middle">[ VIDEO SURFACE ]</text>
  </g>

  <g id="action-rail" font-family="sans-serif">
    <g transform="translate(594, 660)">
      <rect x="0" y="0" width="58" height="320" rx="28" fill="#000000" opacity="0.38"/>
      <rect x="0" y="0" width="58" height="320" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

      <g transform="translate(5, 8)">
        <circle cx="24" cy="24" r="24" fill="#000000" opacity="0.35"/>
        <circle cx="24" cy="24" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1"/>
        <text x="24" y="30" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">CC</text>
      </g>

      <g transform="translate(5, 68)">
        <circle cx="24" cy="24" r="24" fill="#000000" opacity="0.35"/>
        <circle cx="24" cy="24" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1"/>
        <text x="24" y="32" font-size="18" fill="#FFFFFF" text-anchor="middle">&#9834;</text>
      </g>

      <g transform="translate(5, 128)" id="sync-toggle">
        <circle cx="24" cy="24" r="24" fill="#000000" opacity="0.35"/>
        <circle cx="24" cy="24" r="24" fill="none" stroke="#7C5DFF" stroke-width="3"/>
        <text x="24" y="30" font-size="16" fill="#7C5DFF" text-anchor="middle" font-weight="600">&#8693;</text>
      </g>

      <g transform="translate(5, 188)">
        <circle cx="24" cy="24" r="24" fill="#000000" opacity="0.35"/>
        <circle cx="24" cy="24" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1"/>
        <text x="24" y="32" font-size="18" fill="#FFFFFF" text-anchor="middle">&#10227;</text>
      </g>

      <g transform="translate(5, 248)">
        <circle cx="24" cy="24" r="24" fill="#000000" opacity="0.35"/>
        <circle cx="24" cy="24" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1"/>
        <text x="24" y="32" font-size="18" fill="#FFFFFF" text-anchor="middle">&#8943;</text>
      </g>
    </g>
  </g>

  <g id="bottom-block" font-family="sans-serif">
    <rect x="40" y="1100" width="640" height="380" fill="url(#bottomScrim)"/>
    <defs>
      <linearGradient id="bottomScrim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
      </linearGradient>
    </defs>

    <g id="seek-row" transform="translate(54, 1140)">
      <text x="0" y="20" font-size="14" fill="#FFFFFF" fill-opacity="0.75" font-weight="500">12:34</text>
      <rect x="68" y="12" width="464" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.25"/>
      <rect x="68" y="12" width="180" height="6" rx="3" fill="#7C5DFF"/>
      <circle cx="248" cy="15" r="12" fill="#FFFFFF" stroke="#7C5DFF" stroke-width="3"/>
      <text x="572" y="20" font-size="14" fill="#FFFFFF" fill-opacity="0.75" font-weight="500" text-anchor="end">45:21</text>
    </g>

    <g id="transport-row" transform="translate(0, 1240)">
      <g transform="translate(40, 0)">
        <circle cx="20" cy="20" r="20" fill="#000000" fill-opacity="0.35"/>
        <circle cx="20" cy="20" r="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="1"/>
        <text x="20" y="26" font-size="16" fill="#FFFFFF" text-anchor="middle">&#128274;</text>
      </g>
      <g transform="translate(140, 0)">
        <rect x="0" y="6" width="48" height="44" rx="10" fill="#7C5DFF" fill-opacity="0.22"/>
        <rect x="0" y="6" width="48" height="44" rx="10" fill="none" stroke="#7C5DFF" stroke-opacity="0.55" stroke-width="1"/>
        <text x="10" y="36" font-size="13" font-weight="900" fill="#7C5DFF">&#171;</text>
        <text x="20" y="36" font-size="12" font-weight="900" fill="#7C5DFF">10s</text>
      </g>
      <g transform="translate(220, 0)">
        <circle cx="24" cy="28" r="24" fill="none"/>
        <text x="24" y="36" font-size="26" fill="#FFFFFF" text-anchor="middle">&#9198;</text>
      </g>
      <g transform="translate(308, -16)">
        <circle cx="52" cy="52" r="36" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <text x="52" y="64" font-size="38" fill="#FFFFFF" text-anchor="middle" font-weight="700">&#9654;</text>
      </g>
      <g transform="translate(448, 0)">
        <circle cx="24" cy="28" r="24" fill="none"/>
        <text x="24" y="36" font-size="26" fill="#FFFFFF" text-anchor="middle">&#9197;</text>
      </g>
      <g transform="translate(528, 0)">
        <rect x="0" y="6" width="48" height="44" rx="10" fill="#7C5DFF" fill-opacity="0.22"/>
        <rect x="0" y="6" width="48" height="44" rx="10" fill="none" stroke="#7C5DFF" stroke-opacity="0.55" stroke-width="1"/>
        <text x="14" y="36" font-size="12" font-weight="900" fill="#7C5DFF">10s</text>
        <text x="32" y="36" font-size="13" font-weight="900" fill="#7C5DFF">&#187;</text>
      </g>
    </g>
  </g>

  <g id="callouts" font-family="sans-serif" font-size="11">
    <line x1="540" y1="900" x2="690" y2="900" stroke="#7C5DFF" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="690" y="895" fill="#7C5DFF">sync toggle (3 states,</text>
    <text x="690" y="910" fill="#7C5DFF">48dp circle, accent border)</text>

    <line x1="60" y1="1196" x2="60" y2="1240" stroke="#7C5DFF" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="60" y="1192" fill="#7C5DFF" text-anchor="middle">12dp gap</text>
  </g>

  <g id="legend" font-family="sans-serif" font-size="14" fill="#FFFFFF">
    <text x="360" y="1530" text-anchor="middle" font-weight="600" font-size="16" fill="#FFFFFF">SYNC TOGGLE STATES</text>

    <g transform="translate(80, 1550)">
      <circle cx="22" cy="22" r="22" fill="#000000" fill-opacity="0.35"/>
      <circle cx="22" cy="22" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.40" stroke-width="2"/>
      <text x="22" y="28" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600">&#8693;</text>
      <text x="58" y="26" fill="#A0A4AB" font-size="13">OFF</text>
    </g>

    <g transform="translate(220, 1550)">
      <circle cx="22" cy="22" r="22" fill="#000000" fill-opacity="0.35"/>
      <circle cx="22" cy="22" r="22" fill="none" stroke="#7C5DFF" stroke-width="3"/>
      <text x="22" y="28" font-size="16" fill="#7C5DFF" text-anchor="middle" font-weight="600">&#8693;</text>
      <text x="58" y="26" fill="#A0A4AB" font-size="13">ON idle</text>
    </g>

    <g transform="translate(380, 1550)">
      <circle cx="22" cy="22" r="22" fill="#000000" fill-opacity="0.35"/>
      <circle cx="22" cy="22" r="22" fill="none" stroke="#7C5DFF" stroke-width="3"/>
      <circle cx="22" cy="22" r="28" fill="none" stroke="#7C5DFF" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
      <text x="22" y="28" font-size="16" fill="#7C5DFF" text-anchor="middle" font-weight="600">&#8693;</text>
      <text x="64" y="26" fill="#A0A4AB" font-size="13">ON syncing</text>
    </g>
  </g>
</svg>
