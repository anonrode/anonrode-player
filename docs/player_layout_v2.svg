<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600">
  <rect x="20" y="20" width="680" height="1560" rx="40" ry="40" fill="#0F1115" stroke="#2A2D33" stroke-width="2"/>
  <rect x="20" y="20" width="680" height="48" fill="#000000" opacity="0.4"/>

  <g id="top-bar">
    <rect x="40" y="100" width="640" height="72" rx="20" fill="#1A1D22" opacity="0.85"/>
    <path d="M 90 132 L 110 152 L 90 172" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="140" y="148" font-family="sans-serif" font-size="20" fill="#FFFFFF" font-weight="500">Episode Title &#8212; S01E03</text>
    <text x="140" y="170" font-family="sans-serif" font-size="14" fill="#A0A4AB" font-weight="400">Series Name &#183; 45:21</text>
    <circle cx="640" cy="146" r="22" fill="#2A2D33"/>
    <text x="640" y="153" font-family="sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle">&#8943;</text>
  </g>

  <g id="video">
    <rect x="40" y="200" width="640" height="900" fill="#000000"/>
    <text x="360" y="650" font-family="sans-serif" font-size="32" fill="#5A5E66" text-anchor="middle">[ VIDEO SURFACE ]</text>
  </g>

  <g id="action-rail">
    <rect x="600" y="620" width="64" height="380" rx="32" fill="#1A1D22" opacity="0.75"/>

    <g transform="translate(616, 644)">
      <circle cx="16" cy="16" r="20" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="16" y="22" font-family="sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">CC</text>
    </g>

    <g transform="translate(616, 720)">
      <circle cx="16" cy="16" r="20" fill="none" stroke="#A0A4AB" stroke-width="2.5"/>
      <text x="16" y="22" font-family="sans-serif" font-size="18" fill="#A0A4AB" text-anchor="middle">&#9834;</text>
    </g>

    <g transform="translate(616, 796)">
      <circle cx="16" cy="16" r="20" fill="none" stroke="#7C5DFF" stroke-width="3"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" fill="#7C5DFF" text-anchor="middle" font-weight="600">&#8693;</text>
    </g>
    <text x="648" y="860" font-family="sans-serif" font-size="9" fill="#7C5DFF" text-anchor="middle">SYNCED</text>

    <g transform="translate(616, 884)">
      <circle cx="16" cy="16" r="20" fill="none" stroke="#A0A4AB" stroke-width="2.5"/>
      <text x="16" y="22" font-family="sans-serif" font-size="16" fill="#A0A4AB" text-anchor="middle">&#10227;</text>
    </g>

    <g transform="translate(616, 960)">
      <circle cx="16" cy="16" r="20" fill="none" stroke="#A0A4AB" stroke-width="2.5"/>
      <text x="16" y="22" font-family="sans-serif" font-size="18" fill="#A0A4AB" text-anchor="middle">&#8943;</text>
    </g>
  </g>

  <g id="rail-callout">
    <line x1="664" y1="812" x2="730" y2="812" stroke="#7C5DFF" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="735" y="808" font-family="sans-serif" font-size="13" fill="#7C5DFF" font-weight="500">SYNC TOGGLE</text>
    <text x="735" y="824" font-family="sans-serif" font-size="11" fill="#A0A4AB">tap = on/off</text>
    <text x="735" y="838" font-family="sans-serif" font-size="11" fill="#A0A4AB">long-press = resync</text>
  </g>

  <g id="seek">
    <rect x="40" y="1140" width="640" height="6" rx="3" fill="#2A2D33"/>
    <rect x="40" y="1140" width="180" height="6" rx="3" fill="#7C5DFF"/>
    <circle cx="220" cy="1143" r="12" fill="#FFFFFF" stroke="#7C5DFF" stroke-width="3"/>
    <text x="40" y="1180" font-family="sans-serif" font-size="14" fill="#A0A4AB" font-weight="500">12:34</text>
    <text x="680" y="1180" font-family="sans-serif" font-size="14" fill="#A0A4AB" font-weight="500" text-anchor="end">45:21</text>
  </g>

  <g id="transport">
    <g transform="translate(60, 1280)">
      <circle cx="20" cy="20" r="20" fill="none" stroke="#A0A4AB" stroke-width="2.5"/>
      <text x="20" y="26" font-family="sans-serif" font-size="16" fill="#A0A4AB" text-anchor="middle">&#128274;</text>
    </g>

    <g transform="translate(140, 1296)">
      <circle cx="24" cy="24" r="24" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="24" y="32" font-family="sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600">&#9198;</text>
    </g>

    <g transform="translate(220, 1296)">
      <circle cx="24" cy="24" r="24" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="24" y="30" font-family="sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">&#9198;</text>
    </g>

    <g transform="translate(296, 1280)">
      <circle cx="36" cy="36" r="36" fill="#7C5DFF"/>
      <text x="36" y="46" font-family="sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="700">&#9654;</text>
    </g>

    <g transform="translate(404, 1296)">
      <circle cx="24" cy="24" r="24" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="24" y="30" font-family="sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">&#9197;</text>
    </g>

    <g transform="translate(484, 1296)">
      <circle cx="24" cy="24" r="24" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="24" y="32" font-family="sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="600">&#9197;</text>
    </g>
  </g>

  <g id="annotations" font-family="sans-serif" font-size="12" fill="#5A5E66">
    <line x1="356" y1="80" x2="356" y2="60" stroke="#5A5E66" stroke-dasharray="4,3"/>
    <text x="360" y="55" fill="#A0A4AB">TOP BAR &#8212; auto-hides after 3s of inactivity</text>

    <line x1="50" y1="1170" x2="50" y2="1120" stroke="#5A5E66" stroke-dasharray="4,3"/>
    <text x="50" y="1110" fill="#A0A4AB">SEEK BAR &#8212; always visible</text>

    <line x1="368" y1="1352" x2="368" y2="1410" stroke="#5A5E66" stroke-dasharray="4,3"/>
    <text x="368" y="1425" fill="#A0A4AB" text-anchor="middle">TRANSPORT ROW &#8212; auto-hides with controls</text>
  </g>

  <g id="legend" font-family="sans-serif" font-size="14" fill="#FFFFFF">
    <text x="360" y="1490" text-anchor="middle" font-weight="600" font-size="18" fill="#FFFFFF">SYNC TOGGLE STATES</text>

    <g transform="translate(80, 1510)">
      <circle cx="16" cy="16" r="16" fill="none" stroke="#5A5E66" stroke-width="2.5"/>
      <text x="16" y="22" font-size="12" fill="#5A5E66" text-anchor="middle" font-weight="600">&#8693;</text>
      <text x="50" y="20" fill="#A0A4AB" font-size="14">OFF (default)</text>
    </g>

    <g transform="translate(280, 1510)">
      <circle cx="16" cy="16" r="16" fill="none" stroke="#7C5DFF" stroke-width="3"/>
      <text x="16" y="22" font-size="12" fill="#7C5DFF" text-anchor="middle" font-weight="600">&#8693;</text>
      <text x="50" y="20" fill="#A0A4AB" font-size="14">ON (idle)</text>
    </g>

    <g transform="translate(480, 1510)">
      <circle cx="16" cy="16" r="16" fill="none" stroke="#7C5DFF" stroke-width="3"/>
      <circle cx="16" cy="16" r="22" fill="none" stroke="#7C5DFF" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
      <text x="16" y="22" font-size="12" fill="#7C5DFF" text-anchor="middle" font-weight="600">&#8693;</text>
      <text x="50" y="20" fill="#A0A4AB" font-size="14">ON (syncing)</text>
    </g>
  </g>
</svg>
